[project]
name = "character-asset-generator"
version = "0.1.0"
description = "LangChain pipeline turning a character brief into masked sprite assets"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langgraph>=1.0",
    "pillow>=10",
    "numpy>=1.26",
    "pyobjc-framework-Vision>=10",
    "pyobjc-framework-Quartz>=10",
]

[project.scripts]
cag = "cag.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
